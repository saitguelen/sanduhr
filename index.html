<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <title>Sanduhr</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="stage">
      <div class="glass-wrap" id="glassWrap" title="Rahmen: Umdrehen · Glas: Start/Pause">
        <canvas id="glass" role="img" aria-label="Sanduhr"></canvas>
      </div>
      <div class="time" id="time" aria-live="off">05:00</div>
      <p class="dur" id="durLabel">Dauer: 5 min</p>
    </section>

    <section class="panel">
      <h1>Sanduhr</h1>

      <div class="presets" role="group" aria-label="Dauer wählen">
        <button type="button" class="preset" data-min="1">1 min</button>
        <button type="button" class="preset" data-min="5">5 min</button>
        <button type="button" class="preset" data-min="10">10 min</button>
        <button type="button" class="preset" data-min="15">15 min</button>
        <button type="button" class="preset" data-min="30">30 min</button>
      </div>

      <form class="custom" id="customForm">
        <label for="customMin">Eigene Dauer (Minuten)</label>
        <div class="row">
          <input id="customMin" type="number" min="0.1" max="600" step="any"
                 inputmode="decimal" placeholder="z. B. 7" required>
          <button type="submit">Setzen</button>
        </div>
      </form>

      <div class="controls">
        <button type="button" id="startBtn" class="primary">Start</button>
        <button type="button" id="flipBtn">Umdrehen</button>
        <button type="button" id="resetBtn">Zurücksetzen</button>
      </div>

      <div class="options">
        <button type="button" id="soundBtn" aria-pressed="true">🔊 Ton an</button>
        <button type="button" id="fullBtn">⛶ Vollbild</button>
      </div>

      <details class="history" id="historyBox" hidden>
        <summary>Letzte Durchläufe</summary>
        <ul id="historyList"></ul>
      </details>

      <p class="hint">Tastatur / Fernbedienung: Leertaste = Start/Pause </p>
      <p class="hint">U = Umdrehen</p>
      <p class="hint">R = Zurücksetzen</p>
    </section>
  </main>

  <div class="done" id="done" hidden>
    <div class="done-box" role="alertdialog" aria-labelledby="doneText">
      <p id="doneText">Sanduhr fertig</p>
      <button type="button" id="doneOk" class="primary">OK</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
